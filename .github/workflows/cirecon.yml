name: CIRecon

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  cirecon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arpita-rathwa/CIRecon@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
